name: n8n upload source checks
on:
  pull_request:
    paths:
      - tools/n8n-github-upload/**
      - .github/workflows/n8n-upload-candidate-ci.yml
  push:
    branches: [main]
    paths:
      - tools/n8n-github-upload/**
      - .github/workflows/n8n-upload-candidate-ci.yml

permissions:
  contents: read

concurrency:
  group: n8n-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          check-latest: false
          package-manager-cache: false
      - name: Check only local fixtures, journal and workflow source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n8n-source-bin"
          ln -s "$(command -v python3)" "$RUNNER_TEMP/n8n-source-bin/python"
          export PATH="$RUNNER_TEMP/n8n-source-bin:$PATH"
          node --check tools/n8n-github-upload/pilot-bootstrap.cjs
          node tools/n8n-github-upload/test_upload_bootstrap.cjs
          node --test tools/n8n-github-upload/test_universal_bootstrap.cjs tools/n8n-github-upload/test_runtime_observation.cjs tools/n8n-github-upload/test_universal_workflow.mjs
          python -m unittest discover -s tools/n8n-github-upload -p 'test_*.py' -q
