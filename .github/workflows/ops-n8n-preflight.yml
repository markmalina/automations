name: n8n Ops onboarding preflight

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: n8n-upload-onboarding
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      ${{
        github.run_attempt == 1 &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'markmalina/automations' &&
        github.repository_id == '1448151721' &&
        github.actor_id == '23397294' &&
        github.event.comment.user.id == 23397294 &&
        github.event.issue.number == 1 &&
        !github.event.issue.pull_request &&
        github.event.comment.body == '/n8n-ops preflight'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact client revision
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check onboarding contracts without provider access
        uses: markmalina/ops/agent-ops/actions/n8n-upload-preflight@0ff69fc58cb6cb6a70f68d2c01e986628b98ab2c
      - name: Save redacted candidate report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n8n-ops-preflight-${{ github.run_id }}
          path: n8n-ops-preflight-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
