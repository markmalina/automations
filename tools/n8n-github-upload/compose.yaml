# Candidate for an existing Docker host. Not a deployed service.
services:
  n8n:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:?set stable HTTPS hostname}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set persistent encryption key}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_PAYLOAD_SIZE_MAX: "64"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
    volumes:
      - n8n_data:/home/node/.n8n
      - upload_data:/home/node/.n8n-files
volumes:
  n8n_data:
  upload_data:
